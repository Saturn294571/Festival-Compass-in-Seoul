<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Details & Recommendations - Festival Compass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="d-flex flex-column min-vh-100">
    <!-- 헤더 -->
    <header class="border-bottom">
      <div class="container">
        <div class="d-flex align-items-center justify-content-between py-3">
                      <a href="/frontend/index.html" class="d-flex align-items-center text-dark text-decoration-none">
                        <i class="bi bi-compass-fill fs-4 me-2 text-primary"></i>
                        <span class="fs-4 fw-bold">Festival Compass in Seoul</span>
                      </a>
                      <div class="ms-auto">
                        <button class="btn btn-outline-secondary" type="button" disabled>
                          <i class="bi bi-globe"></i> Language
                        </button>
                      </div>        </div>
      </div>
    </header>
    
    <!-- 메인 콘텐츠 -->
    <main class="flex-grow-1">
      <div class="container py-4">
        
        <!-- 메인 축제 상세 정보 -->
        <div id="festival-detail-content">
          <!-- script.js에 의해 내용이 채워집니다. -->
        </div>

        <!-- 메인 콘텐츠용 로딩 스피너 -->
        <div id="loader-detail" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">축제 상세 정보를 불러오는 중...</p>
        </div>

        <!-- 메인 콘텐츠용 에러 메시지 -->
        <div id="error-detail" class="alert alert-danger d-none" role="alert">
          축제 상세 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.
        </div>

        <hr class="my-5">

        <!-- 추천 섹션 -->
        <div id="recommendations-section" class="d-none">
          <!-- Track 1: "이런 축제는 어떠세요?" -->
          <h2 class="display-6 fw-bold mb-4">
            <i class="bi bi-star-fill text-warning"></i> 이런 축제가 가장 비슷해요.
            <small class="text-muted fs-5 ms-2">(가장 유사한 행사)</small>
          </h2>
          <div id="track1-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- 추천 카드가 여기에 삽입됩니다. -->
          </div>
          <div id="loader-track1" class="text-center py-5 d-none">
          <div class="spinner-border text-warning" role="status"><span class="visually-hidden">Loading...</span></div>
          </div>
          <div id="error-track1" class="alert alert-warning d-none" role="alert">
              비슷한 행사를 찾을 수 없습니다.
          </div>
        </div>
          
        <hr class="my-5">

          <!-- Track 2: "이런 지역은 어떠세요?" -->
          <h2 class="display-6 fw-bold mb-4">
            <i class="bi bi-shuffle text-success"></i> 이런 축제는 어떠세요?
            <small class="text-muted fs-5 ms-2">(새로운 지역에서의 숨겨진 발견!)</small>
          </h2>
          <div id="track2-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- 추천 카드가 여기에 삽입됩니다. -->
          </div>
          <div id="loader-track2" class="text-center py-5 d-none">
            <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
          </div>
          <div id="error-track2" class="alert alert-warning d-none" role="alert">
            다른 지역에 대한 추천을 찾을 수 없습니다.
          </div>
      </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer mt-auto py-3 bg-light border-top">
      <div class="container text-center">
        <span class="text-muted">© 2025 Festival Compass in Seoul. All Rights Reserved.</span>
      </div>
    </footer>
  </div>
  
  <script src="/frontend/script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
