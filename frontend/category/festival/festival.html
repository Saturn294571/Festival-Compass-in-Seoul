<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Festivals - Festival Compass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="d-flex flex-column min-vh-100">
    <!-- 헤더 -->
    <header class="border-bottom">
      <div class="container">
        <div class="d-flex align-items-center justify-content-between py-3">
                      <a href="/frontend/index.html" class="d-flex align-items-center text-dark text-decoration-none">
                        <i class="bi bi-compass-fill fs-4 me-2 text-primary"></i>
                        <span class="fs-4 fw-bold">Festival Compass in Seoul</span>
                      </a>
                      <div class="ms-auto">
                        <button class="btn btn-outline-secondary" type="button" disabled>
                          <i class="bi bi-globe"></i> Language
                        </button>
                      </div>        </div>
      </div>
    </header>
    
    <!-- 메인 콘텐츠 -->
    <main class="flex-grow-1">
      <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="display-6 fw-bold" id="festival-list-title">Festivals in ...</h1>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left"></i> 뒤로가기
            </a>
        </div>

        <!-- 로딩 스피너 -->
        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">축제 목록을 불러오는 중...</p>
        </div>
        
        <!-- 에러 메시지 플레이스홀더 -->
        <div id="error-message" class="alert alert-danger d-none" role="alert">
          축제 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.
        </div>

        <!-- 축제 목록 -->
        <div id="festivalList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          <!-- 축제 카드는 script.js에 의해 동적으로 삽입됩니다. -->
        </div>
      </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer mt-auto py-3 bg-light border-top">
      <div class="container text-center">
        <span class="text-muted">© 2025 Festival Compass in Seoul. All Rights Reserved.</span>
      </div>
    </footer>
  </div>
  
  <script src="/frontend/script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
